name: Manually Move First File

on:
  workflow_dispatch:   # Manual trigger only

jobs:
  move-file:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source repo (liv)
      - name: Checkout source repository (soheilins/liv)
        uses: actions/checkout@v4
        with:
          repository: soheilins/liv
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          fetch-depth: 1    # Shallow clone to save time

      # 2. Identify the first file in the target folder
      - name: Find first file in 0517034154
        id: finder
        run: |
          FOLDER="0517034154"
          if [ ! -d "$FOLDER" ]; then
            echo "❌ Folder '$FOLDER' not found!"
            exit 1
          fi
          # Get the first file (alphabetical order)
          FIRST_FILE=$(ls -1 "$FOLDER" | head -n 1)
          if [ -z "$FIRST_FILE" ]; then
            echo "❌ No files in '$FOLDER'"
            exit 1
          fi
          echo "first_file=$FIRST_FILE" >> $GITHUB_OUTPUT
          echo "📄 First file: $FIRST_FILE"

      # 3. Copy that file to destination repo (saba) using a dedicated action
      - name: Copy file to soheilins/saba
        uses: dmnemec/copy_file_to_another_repo_action@v1.1.1
        env:
          API_TOKEN_GITHUB: ${{ secrets.MY_GITHUB_TOKEN }}
        with:
          source_file: '0517034154/${{ steps.finder.outputs.first_file }}'
          destination_repo: 'soheilins/saba'
          # Optional: put file into a subfolder (remove line if you want root)
          destination_folder: 'moved-files'
          user_email: 'your-email@example.com'     # Replace with your GitHub email
          user_name: 'soheilins'                  # Your GitHub username
          commit_message: 'Manual move: ${{ steps.finder.outputs.first_file }} from liv'
