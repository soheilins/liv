name: Copy First 5 Files (No Deletion)

on:
  workflow_dispatch:    # Manual trigger only

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      # Checkout source repository (liv)
      - name: Checkout source repo (soheilins/liv)
        uses: actions/checkout@v4
        with:
          repository: soheilins/liv
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          fetch-depth: 1

      # 1. Identify first 5 files in the target folder
      - name: Find first 5 files
        id: find
        run: |
          FOLDER="0517034154"
          if [ ! -d "$FOLDER" ]; then
            echo "Folder $FOLDER not found!"
            exit 1
          fi
          # List files, take first 5, store as JSON array
          FILES=$(ls -1 "$FOLDER" | head -n 5 | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Found files: $FILES"

      # 2. Checkout destination repository (saba) into a separate directory
      - name: Checkout destination repo (soheilins/saba)
        uses: actions/checkout@v4
        with:
          repository: soheilins/saba
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          path: saba-dest
          fetch-depth: 1

      # 3. Copy the files into the destination repo
      - name: Copy files to destination
        run: |
          # Create a folder inside destination (optional, change or remove as needed)
          mkdir -p saba-dest/from-liv
          for file in $(echo '${{ steps.find.outputs.files }}' | jq -r '.[]'); do
            cp "0517034154/$file" saba-dest/from-liv/
            echo "Copied $file"
          done

      # 4. Commit and push changes to destination repo
      - name: Commit and push to saba
        run: |
          cd saba-dest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add from-liv/
          git commit -m "Copy first 5 files from liv/0517034154" || echo "No changes to commit"
          git push
